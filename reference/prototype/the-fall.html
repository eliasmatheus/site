<title>The Fall Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,300&family=JetBrains+Mono:wght@400;500&family=Press+Start+2P&family=VT323&display=swap">
<style>
  /* Layout: inside a lattice of streaked beams; scroll descends a shaft to a gap; through it, the page turns into an old computer. */
  :root {
    --void: #07060a;
    --ink: #ece7dc;
    --muted: #a39d92;
    --amber: #e8a65a;
    --phosphor: #b6f3a1;
    --crt: #0b0f0a;
    --f-display: 'Fraunces', Georgia, serif;
    --f-mono: 'JetBrains Mono', ui-monospace, monospace;
    --f-pixel: 'Press Start 2P', ui-monospace, monospace;
    --f-term: 'VT323', ui-monospace, monospace;
    color-scheme: dark;
  }
  html, body { background: var(--void); color: var(--ink); }
  body { font-family: var(--f-mono); }

  .journey { position: relative; height: 1000vh; }
  .stage { position: sticky; top: 0; height: 100vh; height: 100dvh; overflow: hidden; }
  #gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .whiteout { position: absolute; inset: 0; z-index: 4; background: #fff8ee; pointer-events: none; }

  .label { position: absolute; z-index: 5; top: calc(env(safe-area-inset-top, 0px) + 16px); left: max(16px, env(safe-area-inset-left, 0px)); margin: 0;
    font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); }
  .intro { position: absolute; z-index: 3; inset: 0; display: grid; place-items: center; text-align: center; padding-inline: 16px; pointer-events: none; }
  .intro h1 { margin: 0; max-width: 18ch; font-family: var(--f-display); font-style: italic; font-weight: 300; font-size: clamp(36px, 6vw, 80px); line-height: 1; letter-spacing: -0.02em; text-wrap: balance; text-shadow: 0 2px 30px rgb(7 6 10 / 0.9); }
  .intro p { margin: 18px 0 0; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--amber); }
  .glimpse {
    position: absolute; z-index: 3; left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 24px); margin: 0;
    font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); transition: opacity .4s ease;
  }
  .glimpse b { display: block; margin-top: 4px; font-family: var(--f-display); font-style: italic; font-weight: 300; font-size: clamp(22px, 2.6vw, 34px); letter-spacing: 0; text-transform: none; color: var(--ink); }

  /* ---------- Through the gap: an old computer ---------- */
  .retro {
    position: absolute; z-index: 6; inset: 0; background: var(--crt); color: var(--phosphor);
    clip-path: circle(var(--hole, 0%) at 50% 50%);
    display: grid; grid-template-rows: 1fr auto; padding: max(28px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(20px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
    font-family: var(--f-term);
  }
  .retro::before { /* scanlines */
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(180deg, rgb(0 0 0 / 0) 0 2px, rgb(0 0 0 / 0.28) 2px 3px);
  }
  .retro::after { /* glass vignette */
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at center, rgb(182 243 161 / 0.06), rgb(0 0 0 / 0.75) 100%);
  }
  .boot { align-self: start; max-width: 760px; margin: 0 auto; width: 100%; font-size: clamp(22px, 3vw, 34px); line-height: 1.25; text-shadow: 0 0 6px rgb(182 243 161 / 0.6); white-space: pre-wrap; }
  .boot .cursor { display: inline-block; width: 0.6em; background: var(--phosphor); animation: blink 1s steps(2) infinite; }
  .dialog {
    position: relative; z-index: 1; max-width: 760px; width: 100%; margin: 0 auto; padding: 18px 22px 22px;
    border: 4px double var(--phosphor); background: #050805; box-shadow: 6px 6px 0 rgb(182 243 161 / 0.25);
    font-family: var(--f-pixel); font-size: clamp(11px, 1.3vw, 14px); line-height: 2; color: var(--phosphor);
    opacity: 0; transform: translateY(10px); transition: opacity .3s steps(3), transform .3s steps(3);
  }
  .dialog.on { opacity: 1; transform: none; }
  .dialog .caret { position: absolute; right: 14px; bottom: 8px; animation: blink .8s steps(2) infinite; }
  .toast {
    position: absolute; z-index: 1; top: max(24px, env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); margin: 0;
    padding: 8px 12px; border: 3px solid var(--phosphor); background: #050805; font-family: var(--f-pixel); font-size: 10px; letter-spacing: 1px;
    opacity: 0; transition: opacity .25s steps(3);
  }
  .toast.on { opacity: 1; }
  @keyframes blink { 50% { opacity: 0; } }

  .fallback { position: absolute; inset: 0; display: grid; place-items: center; margin: 0; padding: 24px; text-align: center; color: var(--muted); font-size: 12px; }
  @media (max-width: 640px) { .label { display: none; } }
  @media (prefers-reduced-motion: reduce) { .boot .cursor, .dialog .caret { animation: none; } }
</style>

<div class="journey" id="journey">
  <div class="stage">
    <canvas id="gl" role="img" aria-label="Inside a vast lattice of long, streaked beams. Through gaps between them, glowing windows show moments from the past."></canvas>
    <div class="intro" id="intro">
      <div>
        <h1>Here, the past is a place you can visit.</h1>
        <p>Scroll to fall through it</p>
      </div>
    </div>
    <p class="glimpse" id="glimpse" style="opacity:0">Through a gap<b id="glimpse-text"></b></p>
    <p class="label">Prototype B · part 2 · The fall · v2</p>
    <div class="whiteout" id="whiteout"></div>

    <div class="retro" id="retro" aria-hidden="true">
      <div class="boot" id="boot"></div>
      <div class="dialog" id="dialog">Dad brought home our first computer. I was hooked on the screen.<span class="caret">▼</span></div>
      <p class="toast" id="toast">SAVE FILE · 1999</p>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(() => {
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const coarse = matchMedia('(pointer: coarse)').matches;
  const $ = (id) => document.getElementById(id);
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const smooth = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
  const journey = $('journey'), canvas = $('gl');

  // ---------- scroll ----------
  let scrollP = 0;
  const onScroll = () => {
    const max = journey.offsetHeight - innerHeight;
    scrollP = clamp(scrollY / Math.max(1, max), 0, 1);
  };
  addEventListener('scroll', onScroll, { passive: true });
  addEventListener('resize', onScroll);
  onScroll();
  const look = { x: 0, y: 0, tx: 0, ty: 0 };
  addEventListener('pointermove', (e) => {
    if (e.pointerType !== 'mouse') return;
    look.tx = (e.clientX / innerWidth - 0.5) * 2; look.ty = (e.clientY / innerHeight - 0.5) * 2;
  }, { passive: true });

  // ---------- the retro screen (driven by scroll, works without WebGL) ----------
  const BOOT = ['CPU: PENTIUM', 'MEMORY TEST: 65536K OK', 'HDD 8 GB ........ OK', '', 'LOADING...'];
  const bootEl = $('boot'), dialog = $('dialog'), toast = $('toast'), retro = $('retro');
  let typed = -1;
  function stepRetro() {
    const hole = smooth(0.86, 0.9, scrollP);
    // Pixelated iris: the circle grows in hard steps.
    const pct = Math.round(hole * 12) / 12 * 75;
    retro.style.setProperty('--hole', pct + '%');
    retro.setAttribute('aria-hidden', String(hole < 0.99));
    const t = smooth(0.9, 0.96, scrollP);
    const full = BOOT.join('\n');
    const n = Math.round(full.length * t);
    if (n !== typed) {
      typed = n;
      // The memory test counts up while it types.
      let shown = full.slice(0, n);
      const memLine = full.indexOf('MEMORY TEST: ');
      if (n > memLine + 13 && n < memLine + 22) {
        const kb = Math.round(((n - memLine - 13) / 9) * 64) * 1024;
        shown = full.slice(0, memLine + 13) + kb + 'K';
      }
      bootEl.innerHTML = shown.replace(/&/g, '&amp;').replace(/</g, '&lt;') + '<span class="cursor">&nbsp;</span>';
    }
    dialog.classList.toggle('on', scrollP > 0.965);
    toast.classList.toggle('on', scrollP > 0.975);
  }

  // ---------- WebGL lattice ----------
  if (!window.THREE) {
    const fb = document.createElement('p'); fb.className = 'fallback'; fb.textContent = 'Could not load the 3D engine. Scroll to continue.';
    canvas.replaceWith(fb);
  }
  const T = window.THREE;
  let renderer;
  try { renderer = T && new T.WebGLRenderer({ canvas, antialias: !coarse, powerPreference: 'high-performance' }); } catch (e) { renderer = null; }
  if (T && !renderer) { const fb = document.createElement('p'); fb.className = 'fallback'; fb.textContent = 'This browser has no WebGL.'; canvas.replaceWith(fb); }

  const glimpse = $('glimpse'), glimpseText = $('glimpse-text'), intro = $('intro'), whiteout = $('whiteout');
  let scene, cam, windows = [], shaftDepth = 0, target;

  if (renderer) {
    renderer.setPixelRatio(Math.min(devicePixelRatio || 1, coarse ? 1.25 : 1.75));
    renderer.outputColorSpace = T.SRGBColorSpace;
    scene = new T.Scene();
    scene.background = new T.Color(0x07060a);
    scene.fog = new T.FogExp2(0x0b0907, 0.022);
    cam = new T.PerspectiveCamera(62, 1, 0.1, 400);

    // Streaked texture: long stripes of warm browns, cream and a little teal, as if smeared by motion.
    function streaks(seed, w = 256, h = 32) {
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      const g = c.getContext('2d');
      let s = seed; const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
      g.fillStyle = '#2a1d14'; g.fillRect(0, 0, w, h);
      for (let y = 0; y < h; y++) {
        const r = rnd();
        const col = r < 0.06 ? [210, 225, 220] : r < 0.12 ? [120, 170, 175] : r < 0.4 ? [196, 160, 112] : r < 0.75 ? [120, 82, 52] : [60, 40, 28];
        const k = 0.55 + rnd() * 0.6;
        g.fillStyle = `rgb(${col.map((v) => Math.min(255, Math.round(v * k))).join(',')})`;
        g.fillRect(0, y, w, 1);
      }
      // Smear: a few brighter dashes along the length.
      for (let i = 0; i < 40; i++) {
        const y = Math.floor(rnd() * h), x = rnd() * w, len = 20 + rnd() * 120;
        g.fillStyle = `rgba(255,236,200,${0.15 + rnd() * 0.35})`; g.fillRect(x, y, len, 1);
      }
      const t = new T.CanvasTexture(c);
      t.colorSpace = T.SRGBColorSpace; t.wrapS = t.wrapT = T.RepeatWrapping; t.anisotropy = 4;
      return t;
    }
    const texA = streaks(7), texB = streaks(91);
    const matA = new T.MeshStandardMaterial({ map: texA, emissive: 0xffffff, emissiveMap: texA, emissiveIntensity: 0.28, roughness: 0.85 });
    const matB = new T.MeshStandardMaterial({ map: texB, emissive: 0xffffff, emissiveMap: texB, emissiveIntensity: 0.22, roughness: 0.9 });

    // Lattice: posts along y and beams along x and z on a grid, leaving a central shaft open.
    const CELL = 9, HALF = 4, LEVELS = coarse ? 34 : 46, SPAN = coarse ? 3 : 4;
    shaftDepth = LEVELS * CELL;
    const WIN_D = CELL * 1.7;
    const SPOTS = [[0.24, [1, 0]], [0.39, [0, -1]], [0.54, [-1, 0]], [0.69, [0, 1]]].map(([at, side]) => ({ y: -smooth(0.03, 0.82, at) * (shaftDepth - 6), side }));
    // A beam blocks a gap if it is near the window's height and between the shaft and the window.
    const blocks = (y, alongX, c) => SPOTS.some((w) => {
      if (Math.abs(y - w.y) > 7.5) return false;
      const [sx, sz] = w.side;
      if (alongX) return sx === 0 && Math.sign(c) === sz && Math.abs(c) <= WIN_D + 1; // beam along x at z = c
      return sz === 0 && Math.sign(c) === sx && Math.abs(c) <= WIN_D + 1;              // beam along z at x = c
    }) || SPOTS.some((w) => Math.abs(y - w.y) < 7.5 && Math.abs(c) < 1.5);
    const unit = new T.BoxGeometry(1, 1, 1);
    const mats = [];
    let s = 12345; const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
    const put = (list, x, y, z, sx, sy, sz) => list.push([x, y, z, sx, sy, sz]);
    const posts = [], beamsX = [], beamsZ = [];
    const lines = [];
    for (let i = -SPAN; i <= SPAN; i++) lines.push(i * CELL + (i >= 0 ? HALF : -HALF) * 0 + (i === 0 ? 0 : 0));
    const grid = []; for (let i = -SPAN; i <= SPAN; i++) grid.push(i * CELL);
    // Posts: tall vertical bundles; the four around the shaft frame the view.
    for (const x of grid) for (const z of grid) {
      if (Math.abs(x) < CELL / 2 && Math.abs(z) < CELL / 2) continue;
      // Keep the line of sight to each window clear of posts.
      if (SPOTS.some((w) => (w.side[0] !== 0 && z === 0 && Math.sign(x) === w.side[0] && Math.abs(x) <= WIN_D) || (w.side[1] !== 0 && x === 0 && Math.sign(z) === w.side[1] && Math.abs(z) <= WIN_D))) continue;
      const th = 1.2 + rnd() * 1.6;
      put(posts, x + (rnd() - 0.5) * 1.5, -shaftDepth / 2, z + (rnd() - 0.5) * 1.5, th, shaftDepth + 40, th);
    }
    for (let l = 0; l < LEVELS; l++) {
      const y = -l * CELL - CELL / 2 + (rnd() - 0.5) * 3;
      for (const z of grid) {
        if (rnd() < 0.35) continue;
        const th = 0.8 + rnd() * 2.2, len = CELL * (2 * SPAN) + 6;
        // Beams crossing the shaft are rare, so the fall stays open.
        if (Math.abs(z) < CELL && rnd() < 0.8) continue;
        if (blocks(y, true, z)) continue;
        put(beamsX, 0, y, z + (rnd() - 0.5), len, th, th * (0.6 + rnd()));
      }
      for (const x of grid) {
        if (rnd() < 0.35) continue;
        const th = 0.8 + rnd() * 2.2, len = CELL * (2 * SPAN) + 6;
        if (Math.abs(x) < CELL && rnd() < 0.8) continue;
        if (blocks(y + CELL / 3, false, x)) continue;
        put(beamsZ, x + (rnd() - 0.5), y + CELL / 3, 0, th * (0.6 + rnd()), th, len);
      }
    }
    const instance = (list, mat, rotY) => {
      const m = new T.InstancedMesh(unit, mat, list.length);
      const o = new T.Object3D();
      list.forEach(([x, y, z, sx, sy, sz], i) => { o.position.set(x, y, z); o.scale.set(sx, sy, sz); o.rotation.set(0, rotY ? Math.PI / 2 : 0, 0); o.updateMatrix(); m.setMatrixAt(i, o.matrix); });
      scene.add(m);
    };
    // Stretch the stripes along each beam's long axis.
    texA.repeat.set(1, 1);
    instance(posts, matB, false);
    instance(beamsX, matA, false);
    instance(beamsZ, matA, false);

    // Light: warm from below (the gap), cool from above, plus a lamp that travels with the camera.
    scene.add(new T.AmbientLight(0x3a2c22, 1.2));
    const below = new T.PointLight(0xffc98a, 2.2, 0, 0); scene.add(below);
    const lamp = new T.PointLight(0xffe2bc, 1.4, 60, 1.6); scene.add(lamp);
    const sky = new T.DirectionalLight(0x9fc7d0, 0.6); sky.position.set(0.3, 1, 0.2); scene.add(sky);

    // Moments seen through gaps: glowing pixel windows on the shaft walls.
    function pixelWindow(draw, w = 64, h = 48) {
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      const g = c.getContext('2d'); g.imageSmoothingEnabled = false; draw(g, w, h);
      const t = new T.CanvasTexture(c); t.magFilter = T.NearestFilter; t.minFilter = T.NearestFilter; t.colorSpace = T.SRGBColorSpace;
      return t;
    }
    const txt = (g, s, x, y, col, size = 6) => { g.fillStyle = col; g.font = `${size}px monospace`; g.fillText(s, x, y); };
    const MOMENTS = [
      { label: '2020 · print(’Olá, Mundo!’)', at: 0.24, side: [1, 0], draw: (g, w, h) => { g.fillStyle = '#1e1f22'; g.fillRect(0, 0, w, h); txt(g, "print('Olá,", 4, 12, '#cf8e6d'); txt(g, " Mundo!')", 4, 20, '#6aab73'); g.fillStyle = '#333'; g.fillRect(4, 28, w - 8, 1); txt(g, 'Olá, Mundo!', 4, 38, '#ece7dc'); } },
      { label: '2019 to 2020 · The desert', at: 0.39, side: [0, -1], draw: (g, w, h) => { const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, '#5b3a22'); gr.addColorStop(0.5, '#e3b27a'); gr.addColorStop(0.52, '#8d5a33'); gr.addColorStop(1, '#3d2414'); g.fillStyle = gr; g.fillRect(0, 0, w, h); g.fillStyle = '#c48a52'; g.beginPath(); g.ellipse(18, 30, 30, 8, 0, 0, Math.PI * 2); g.fill(); } },
      { label: '2012 to 2020 · Structures', at: 0.54, side: [-1, 0], draw: (g, w, h) => { g.fillStyle = '#0c0e12'; g.fillRect(0, 0, w, h); g.fillStyle = 'rgba(176,138,90,.35)'; g.fillRect(0, 20, w, 28); g.fillStyle = '#c9ccd2'; g.fillRect(30, 4, 4, 26); g.fillStyle = '#7ee2a8'; g.fillRect(20, 30, 24, 6); } },
      { label: '2011 · The choice', at: 0.69, side: [0, 1], draw: (g, w, h) => { g.fillStyle = '#e3ebc4'; g.fillRect(0, 0, w, h); [['#ffd166', 3], ['#f7f9ec', 23], ['#f7f9ec', 43]].forEach(([c, x]) => { g.fillStyle = '#1f2a1a'; g.fillRect(x - 1, 9, 20, 30); g.fillStyle = c; g.fillRect(x, 10, 18, 28); }); } },
    ];
    for (const m of MOMENTS) {
      const tex = pixelWindow(m.draw);
      const W = 9, H = 6.75;
      const mesh = new T.Mesh(new T.PlaneGeometry(W, H), new T.MeshBasicMaterial({ map: tex, toneMapped: false, fog: false }));
      // Placed where the camera will be at that point of the scroll.
      const y = -smooth(0.03, 0.82, m.at) * (shaftDepth - 6);
      const d = WIN_D;
      mesh.position.set(m.side[0] * d, y, m.side[1] * d);
      mesh.lookAt(0, y, 0);
      scene.add(mesh);
      // Halo: light spilling out of the gap.
      const halo = new T.Mesh(new T.PlaneGeometry(W * 2.4, H * 2.4), new T.MeshBasicMaterial({ color: 0xffc98a, transparent: true, opacity: 0.12, blending: T.AdditiveBlending, depthWrite: false, fog: false }));
      halo.position.copy(mesh.position).multiplyScalar(1.02); halo.position.y = y; halo.lookAt(0, y, 0);
      const pl = new T.PointLight(0xffc98a, 1.2, 30, 1.8); pl.position.set(m.side[0] * (d - 2), y, m.side[1] * (d - 2)); scene.add(pl);
      windows.push({ ...m, y, mesh });
    }

    // The first moment waits at the bottom of the shaft: the old computer, face up.
    const bootTex = pixelWindow((g, w, h) => {
      g.fillStyle = '#0b0f0a'; g.fillRect(0, 0, w, h);
      txt(g, 'CPU: PENTIUM', 4, 10, '#b6f3a1', 6);
      txt(g, 'MEMORY TEST:', 4, 19, '#b6f3a1', 6);
      txt(g, '65536K OK', 4, 27, '#b6f3a1', 6);
      txt(g, 'HDD 8 GB..OK', 4, 36, '#b6f3a1', 6);
    }, 64, 44);
    target = new T.Mesh(new T.PlaneGeometry(8, 5.5), new T.MeshBasicMaterial({ map: bootTex, toneMapped: false, fog: false }));
    target.rotation.x = -Math.PI / 2;
    target.position.set(0, -shaftDepth - 2, 0);
    scene.add(target);
    const tHalo = new T.Mesh(new T.PlaneGeometry(30, 30), new T.MeshBasicMaterial({ color: 0xb6f3a1, transparent: true, opacity: 0.08, blending: T.AdditiveBlending, depthWrite: false, fog: false }));
    tHalo.rotation.x = -Math.PI / 2; tHalo.position.set(0, -shaftDepth - 1.9, 0); scene.add(tHalo);
    below.position.set(0, -shaftDepth + 6, 0);
    const floor = [];
    const fy = -shaftDepth - 1.2;
    [[0, fy, -3.6, 12, 1.4, 1.6], [0, fy, 3.6, 12, 1.4, 1.6], [-5, fy, 0, 1.6, 1.4, 8.8], [5, fy, 0, 1.6, 1.4, 8.8]].forEach((b) => floor.push(b));
    for (let k = 0; k < 26; k++) {
      const along = Math.random() < 0.5;
      const off = (Math.random() < 0.5 ? -1 : 1) * (6 + Math.random() * 30);
      const th = 0.8 + Math.random() * 2;
      if (along) floor.push([0, fy - Math.random() * 3, off, 80, th, th]);
      else floor.push([off, fy - Math.random() * 3, 0, th, th, 80]);
    }
    instance(floor, matA, false);

    // Gold dust in the shaft.
    const N = coarse ? 400 : 900;
    const pos = new Float32Array(N * 3);
    for (let i = 0; i < N; i++) { pos[i * 3] = (Math.random() - 0.5) * 16; pos[i * 3 + 1] = -Math.random() * shaftDepth; pos[i * 3 + 2] = (Math.random() - 0.5) * 16; }
    const dg = new T.BufferGeometry(); dg.setAttribute('position', new T.BufferAttribute(pos, 3));
    const dust = new T.Points(dg, new T.PointsMaterial({ color: 0xffcf86, size: 0.09, transparent: true, opacity: 0.8, blending: T.AdditiveBlending, depthWrite: false }));
    scene.add(dust);

    var lampRef = lamp, dustRef = dust;
  }

  // ---------- loop ----------
  let last = performance.now();
  function loop(now) {
    requestAnimationFrame(loop);
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    const w = innerWidth, h = innerHeight;
    whiteout.style.opacity = String(1 - smooth(0, 0.03, scrollP));
    intro.style.opacity = String(smooth(0.004, 0.025, scrollP) * (1 - smooth(0.06, 0.09, scrollP)));
    stepRetro();

    if (!renderer) return;
    const size = renderer.getSize(new T.Vector2());
    if (size.x !== w || size.y !== h) { renderer.setSize(w, h, false); cam.aspect = w / h; cam.updateProjectionMatrix(); }

    look.x += (look.tx - look.x) * 0.05; look.y += (look.ty - look.y) * 0.05;
    // Descent: fast in the middle, slowing as the gap at the bottom opens; then through it.
    const fall = smooth(0.03, 0.82, scrollP);
    const through = smooth(0.82, 0.9, scrollP);
    const y = -fall * (shaftDepth - 6) - through * 8;
    const tumble = reduce ? 0 : (1 - smooth(0, 0.08, scrollP)) * 0.8;
    const spin = fall * Math.PI * 0.9 + (reduce ? 0 : Math.sin(now / 2600) * 0.03);
    cam.position.set(look.x * 1.6, y, look.y * 1.6);
    // Looking down the shaft, turning slowly as you fall.
    cam.up.set(Math.sin(spin + tumble * Math.sin(now / 500)), 0, Math.cos(spin + tumble * Math.sin(now / 500)));
    // Passing a gap: the gaze swings toward the window, then back down the shaft.
    let gx = look.x * 0.4, gz = look.y * 0.4, gy = y - 20;
    for (const m of windows) {
      const k = Math.max(0, 1 - Math.abs(m.y - y) / 22);
      const w = k * k * (3 - 2 * k) * (reduce ? 0.5 : 0.85);
      if (w > 0) { gx += (m.mesh.position.x - gx) * w * 0.8; gz += (m.mesh.position.z - gz) * w * 0.8; gy += (m.y - gy) * w * 0.8; }
    }
    cam.lookAt(gx, gy, gz);
    const baseFov = w / h < 0.8 ? 82 : 62;
    cam.fov = baseFov + through * 20; cam.updateProjectionMatrix();
    lampRef.position.set(0, y - 4, 0);
    dustRef.rotation.y += dt * (reduce ? 0 : 0.03);

    // Which gap are we passing?
    let near = null;
    for (const m of windows) if (Math.abs(m.y - y) < 18) near = m;
    if (scrollP > 0.7 && scrollP < 0.86) near = { label: 'Late 90s · The first computer' };
    glimpse.style.opacity = near && scrollP > 0.08 && scrollP < 0.86 ? '1' : '0';
    if (near) glimpseText.textContent = near.label;

    renderer.render(scene, cam);
  }
  requestAnimationFrame(loop);
})();
</script>
