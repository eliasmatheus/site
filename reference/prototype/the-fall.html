<title>The Fall Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,300;1,9..144,400&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600&display=swap">
<style>
  /* Layout: a sticky 3D corridor of light threads; scroll travels through time; moments float as panels. Single dark world. */
  :root {
    --void: #05060a;
    --ink: #ece7dc;
    --muted: #9b968c;
    --amber: #e8a65a;
    --teal: #5cc4cc;
    --line: rgb(236 231 220 / 0.14);
    --panel: rgb(10 12 18 / 0.82);
    --f-display: 'Fraunces', Georgia, serif;
    --f-body: 'Space Grotesk', system-ui, sans-serif;
    --f-mono: 'JetBrains Mono', ui-monospace, monospace;
    color-scheme: dark;
  }
  html, body { background: var(--void); color: var(--ink); }
  body { font-family: var(--f-body); }

  .journey { position: relative; height: 900vh; }
  .space { position: sticky; top: 0; height: 100vh; height: 100dvh; overflow: hidden; perspective: 900px; }
  #threads { position: absolute; inset: 0; width: 100%; height: 100%; }
  .whiteout { position: absolute; inset: 0; z-index: 4; background: #fff8ee; pointer-events: none; }

  .label { position: absolute; z-index: 5; top: calc(env(safe-area-inset-top, 0px) + 16px); left: max(16px, env(safe-area-inset-left, 0px)); margin: 0;
    font-family: var(--f-mono); font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); }
  .year {
    position: absolute; z-index: 5; top: calc(env(safe-area-inset-top, 0px) + 10px); right: max(16px, env(safe-area-inset-right, 0px)); margin: 0; text-align: right;
    font-family: var(--f-mono); font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted);
  }
  .year b { display: block; margin-top: 2px; font-family: var(--f-display); font-style: italic; font-weight: 300; font-size: clamp(28px, 3.4vw, 44px); letter-spacing: 0; color: var(--amber); font-variant-numeric: tabular-nums; }

  .intro { position: absolute; z-index: 3; inset: 0; display: grid; place-items: center; text-align: center; padding-inline: 16px; pointer-events: none; transition: opacity .6s ease; }
  .intro h1 { margin: 0; max-width: 18ch; font-family: var(--f-display); font-style: italic; font-weight: 300; font-size: clamp(36px, 6vw, 80px); line-height: 1; letter-spacing: -0.02em; text-wrap: balance; text-shadow: 0 2px 30px rgb(5 6 10 / 0.8); }
  .intro p { margin: 18px 0 0; font-family: var(--f-mono); font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--amber); }

  /* Moments: buttons placed by JS in screen space (projected from the corridor). */
  .moments { position: absolute; inset: 0; z-index: 2; perspective: 900px; }
  .moment {
    position: absolute; left: 0; top: 0; width: 300px; padding: 0; border: 1px solid var(--line); border-radius: 10px;
    background: var(--panel); color: var(--ink); text-align: left; font: inherit; cursor: pointer;
    transform-origin: 0 0; will-change: transform, opacity; backdrop-filter: blur(4px);
    box-shadow: 0 0 0 rgb(232 166 90 / 0); transition: box-shadow .3s ease, border-color .3s ease;
  }
  .moment:hover, .moment:focus-visible { border-color: rgb(232 166 90 / 0.7); box-shadow: 0 0 40px rgb(232 166 90 / 0.25); outline: none; }
  .moment .when { display: flex; justify-content: space-between; gap: 8px; padding: 10px 12px 0; font-family: var(--f-mono); font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--amber); }
  .moment .tag { color: var(--teal); }
  .moment .cap { margin: 0; padding: 6px 12px 12px; font-size: 14px; line-height: 1.35; }
  .mini { margin: 10px 12px 0; height: 120px; border-radius: 6px; overflow: hidden; background: #000; position: relative; }

  /* Minis: small stills of each moment, CSS and SVG only. */
  .boot { padding: 12px; font-family: var(--f-mono); font-size: 11px; line-height: 1.7; color: #c7d3c0; }
  .courses { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 14px 10px; background: #e3ebc4; height: 100%; box-sizing: border-box; }
  .courses span { display: grid; place-items: center; border: 2px solid #1f2a1a; border-radius: 6px; background: #f7f9ec; color: #1f2a1a; font-family: var(--f-mono); font-size: 8px; text-align: center; padding: 4px; }
  .courses span.on { background: #ffd166; }
  .dunes { background: linear-gradient(180deg, #5b3a22 0%, #b47a46 45%, #e3b27a 60%, #8d5a33 61%, #3d2414 100%); }
  .dunes::after { content: ""; position: absolute; inset: 55% -10% 0; background: radial-gradient(ellipse at 30% 0%, #c48a52 0 40%, transparent 41%), radial-gradient(ellipse at 75% 10%, #a26a3d 0 35%, transparent 36%); }
  .editor { padding: 10px 12px; background: #1e1f22; font-family: var(--f-mono); font-size: 11px; line-height: 1.8; color: #bcbec4; }
  .editor .k { color: #cf8e6d; } .editor .s { color: #6aab73; } .editor .out { margin-top: 10px; padding-top: 8px; border-top: 1px solid #333; color: #ece7dc; }
  .calc { display: grid; place-items: center; height: 100%; background: #e8e8e8; color: #222; font-family: var(--f-mono); font-size: 13px; }
  .calc div { display: flex; gap: 6px; align-items: center; }
  .calc i { display: inline-block; width: 34px; padding: 3px 0; border: 1px solid #999; background: #fff; text-align: center; font-style: normal; }
  .term { padding: 10px 12px; background: #2b0b20; font-family: var(--f-mono); font-size: 10.5px; line-height: 1.7; color: #eee; }
  .term .err { color: #ff8a8a; } .term .ok { color: #8ae28a; }
  .soon { display: grid; place-items: center; height: 100%; background: radial-gradient(circle, #1b2436, #05060a 70%); font-family: var(--f-mono); font-size: 11px; letter-spacing: 2px; color: var(--muted); }

  /* The opened moment. */
  .open {
    position: absolute; z-index: 6; inset: 0; display: grid; place-items: center; padding: 16px;
    background: rgb(5 6 10 / 0.6); backdrop-filter: blur(6px);
  }
  .open[hidden] { display: none; }
  .card { width: min(560px, 100%); border: 1px solid rgb(232 166 90 / 0.5); border-radius: 14px; background: #0b0d13; box-shadow: 0 30px 80px rgb(0 0 0 / 0.6), 0 0 60px rgb(232 166 90 / 0.15); overflow: hidden; }
  .card .mini { height: 220px; margin: 14px 14px 0; }
  .card .boot, .card .editor, .card .term { font-size: 14px; }
  .card h2 { margin: 16px 18px 0; font-family: var(--f-display); font-style: italic; font-weight: 300; font-size: 32px; line-height: 1.05; }
  .card p { margin: 10px 18px 0; color: var(--muted); line-height: 1.5; }
  .card .actions { display: flex; flex-wrap: wrap; gap: 10px; padding: 18px; }
  .btn { min-height: 44px; padding: 0 18px; border-radius: 22px; border: 1px solid var(--line); background: transparent; color: var(--ink); font-family: var(--f-mono); font-size: 12px; letter-spacing: 1.2px; text-transform: uppercase; cursor: pointer; }
  .btn.primary { background: var(--amber); border-color: var(--amber); color: #1a1006; }
  .btn:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
  .note { margin: 0; padding: 0 18px 16px; font-family: var(--f-mono); font-size: 11px; color: var(--muted); }

  .hint { position: absolute; z-index: 5; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); transform: translateX(-50%); margin: 0;
    font-family: var(--f-mono); font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); pointer-events: none; transition: opacity .5s ease; white-space: nowrap; }

  @media (max-width: 640px) {
    .label { display: none; }
    .moment { width: 230px; }
    .mini { height: 96px; }
    .card .mini { height: 170px; }
  }
</style>

<div class="journey" id="journey">
  <div class="space" id="space">
    <canvas id="threads" aria-hidden="true"></canvas>
    <div class="moments" id="moments" role="list" aria-label="Moments from the past"></div>
    <div class="intro" id="intro">
      <div>
        <h1>Here, the past is a place you can visit.</h1>
        <p>Scroll to travel · Click a moment to look closer</p>
      </div>
    </div>
    <div class="whiteout" id="whiteout"></div>
    <p class="label">Prototype B · part 2 · The fall</p>
    <p class="year" aria-live="off">Now passing<b id="year">Late 90s</b></p>
    <p class="hint" id="hint">Scroll</p>

    <div class="open" id="open" hidden role="dialog" aria-modal="true" aria-labelledby="open-title">
      <div class="card">
        <div class="mini" id="open-mini"></div>
        <h2 id="open-title"></h2>
        <p id="open-text"></p>
        <div class="actions">
          <button type="button" class="btn primary" id="open-step">Step in →</button>
          <button type="button" class="btn" id="open-close">Back to the corridor</button>
        </div>
        <p class="note" id="open-note" aria-live="polite"></p>
      </div>
    </div>
  </div>
</div>

<script>
(() => {
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const $ = (id) => document.getElementById(id);
  const cv = $('threads'), ctx = cv.getContext('2d');
  const journey = $('journey'), whiteout = $('whiteout'), intro = $('intro'), yearEl = $('year'), hint = $('hint');
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const smooth = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };

  // ---------- the moments (facts from docs/cenas and reference/originals) ----------
  const MOMENTS = [
    { when: 'Late 90s', year: 1998, title: 'The first computer', cap: 'Dad brought home our first computer.', text: 'A Pentium with an 8 GB disk. I was hooked on the screen: old consoles in emulators, dial-up at night, fixing everyone’s PC.', mini: '<div class="boot">CPU: PENTIUM<br>MEMORY TEST: 65536K OK<br>HDD 8 GB ........ OK<br>LOADING...</div>' },
    { when: '2011', year: 2011, title: 'The choice', cap: 'Everything pointed to computers. I chose civil engineering.', text: 'I wanted math. I wanted engineering. Code and design never crossed my mind.', mini: '<div class="courses"><span class="on">CIVIL ENGINEERING</span><span>COMPUTER SCIENCE</span><span>ARCHITECTURE</span></div>' },
    { when: '2012 to 2020', year: 2016, title: 'Structures', tag: 'Side quest', cap: 'Footings, beams, whole churches.', text: 'Sized against real soil data. Too small fails, too big costs. Find the sweet spot.', mini: '<svg viewBox="0 0 200 120" width="100%" height="100%" preserveAspectRatio="xMidYMid slice"><rect width="200" height="120" fill="#0c0e12"/><rect y="40" width="200" height="40" fill="#b08a5a" fill-opacity=".18"/><rect y="80" width="200" height="40" fill="#d6a560" fill-opacity=".28"/><line x1="0" x2="200" y1="40" y2="40" stroke="#5a4630" stroke-width="2"/><rect x="95" y="8" width="10" height="64" fill="#c9ccd2"/><rect x="74" y="72" width="52" height="12" fill="#7ee2a8"/><path d="M100 0v8M96 4l4 5 4-5" stroke="#ffd84a" fill="none"/></svg>' },
    { when: '2019 to 2020', year: 2019.5, title: 'The desert', cap: 'I was good at the work. I felt I could do more.', text: 'What I was best at and what I did all day were drifting apart.', mini: '<div class="mini dunes" style="margin:0;height:100%"></div>' },
    { when: '2020', year: 2020.2, title: 'The click', tag: 'Side quest', cap: 'print(’Olá, Mundo!’)', text: 'The first line of Python. Then a program that asked for a name, and answered.', mini: '<div class="editor"><span class="k">print</span>(<span class="s">\'Olá, Mundo!\'</span>)<div class="out">Olá, Mundo!</div></div>' },
    { when: 'July 2020', year: 2020.5, title: 'The A + B challenge', cap: 'A small calculator, my answer to a coding challenge.', text: 'Two numbers in, one number out. Delivered in July 2020.', mini: '<div class="calc"><div><i>2</i>+<i>3</i>=<i>5</i></div></div>' },
    { when: 'August 2020', year: 2020.6, title: 'Linux, for the first time', cap: 'A missing comma, at night, on a new OS.', text: 'So excited I installed Ubuntu during an online coding marathon. The query broke, then worked.', mini: '<div class="term"><span class="err">SQLITE_ERROR: near ".": syntax error</span><br>SELECT classes.*, proffys.*<br><span class="ok">✓ 1 row</span></div>' },
    { when: 'Today', year: 2026, title: 'Next stop', cap: 'The first job. Then everything after.', text: 'The rest of the story is still being written.', mini: '<div class="soon">TO BE CONTINUED</div>' },
  ];

  // Corridor coordinates: z is time. Moments alternate sides.
  const SPACING = 26, START = 14;
  MOMENTS.forEach((m, i) => {
    m.z = START + i * SPACING;
    m.x = i === MOMENTS.length - 1 ? -1.5 : (i % 2 ? 3.2 : -6.2);
    m.y = i % 3 === 0 ? -2.2 : i % 3 === 1 ? -0.4 : -3.2;
  });
  const DEPTH_END = MOMENTS[MOMENTS.length - 1].z - 6;

  const wrap = $('moments');
  MOMENTS.forEach((m, i) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'moment'; b.setAttribute('role', 'listitem');
    b.setAttribute('aria-label', `${m.when}. ${m.title}. ${m.cap}`);
    b.innerHTML = `<span class="when"><span>${m.when}</span>${m.tag ? `<span class="tag">${m.tag}</span>` : ''}</span><div class="mini">${m.mini}</div><p class="cap">${m.cap}</p>`;
    b.addEventListener('click', () => openMoment(i));
    b.addEventListener('pointerenter', () => { hovered = i; });
    b.addEventListener('pointerleave', () => { if (hovered === i) hovered = -1; });
    b.addEventListener('focus', () => { hovered = i; });
    m.el = b;
    wrap.appendChild(b);
  });
  let hovered = -1;

  // ---------- open / close ----------
  const open = $('open'), note = $('open-note');
  let lastFocus = null;
  function openMoment(i) {
    const m = MOMENTS[i];
    lastFocus = document.activeElement;
    $('open-mini').innerHTML = m.mini;
    $('open-title').textContent = m.title;
    $('open-text').textContent = m.text;
    note.textContent = '';
    open.hidden = false;
    $('open-step').focus();
  }
  function closeMoment() { open.hidden = true; lastFocus?.focus?.(); }
  $('open-close').addEventListener('click', closeMoment);
  open.addEventListener('click', (e) => { if (e.target === open) closeMoment(); });
  addEventListener('keydown', (e) => { if (e.key === 'Escape' && !open.hidden) closeMoment(); });
  $('open-step').addEventListener('click', () => { note.textContent = 'In the site, this opens the full scene. Not part of this prototype.'; });

  // ---------- scroll and pointer ----------
  let scrollP = 0;
  function onScroll() {
    const max = journey.offsetHeight - innerHeight;
    scrollP = clamp(scrollY / Math.max(1, max), 0, 1);
    hint.style.opacity = scrollP < 0.02 ? '1' : '0';
  }
  addEventListener('scroll', onScroll, { passive: true });
  addEventListener('resize', onScroll);
  const look = { x: 0, y: 0, tx: 0, ty: 0 };
  addEventListener('pointermove', (e) => {
    if (e.pointerType !== 'mouse') return;
    look.tx = (e.clientX / innerWidth - 0.5) * 2; look.ty = (e.clientY / innerHeight - 0.5) * 2;
  }, { passive: true });

  // ---------- projection ----------
  let W = 0, H = 0, F = 0;
  const cam = { x: 0, y: 0, z: 0, roll: 0 };
  function project(x, y, z) {
    const dz = z - cam.z;
    if (dz <= 0.3) return null;
    const cr = Math.cos(cam.roll), sr = Math.sin(cam.roll);
    const rx = x - cam.x, ry = y - cam.y;
    const X = rx * cr - ry * sr, Y = rx * sr + ry * cr;
    return { x: W / 2 + (X / dz) * F, y: H / 2 + (Y / dz) * F, s: F / dz, dz };
  }

  // Corridor of threads: long lines along time, and ribs every few units.
  const XS = [-9, -6, -3, 0, 3, 6, 9], YS = [-6, -3, 0, 3, 6];
  const RIB = 6, VIEW = 90;
  const dust = Array.from({ length: 160 }, () => ({ x: (Math.random() - 0.5) * 18, y: (Math.random() - 0.5) * 12, z: Math.random() * VIEW, s: Math.random() }));

  function drawThreads(t) {
    ctx.clearRect(0, 0, W, H);
    // Warm haze down the corridor.
    // Light at the end of the corridor: an amber core inside a teal halo.
    const vp = project(cam.x * 0.0, 0, cam.z + VIEW) || { x: W / 2, y: H / 2 };
    const R = Math.max(W, H);
    const haze = ctx.createRadialGradient(vp.x, vp.y, 0, vp.x, vp.y, R * 0.75);
    haze.addColorStop(0, 'rgba(255,214,150,0.55)');
    haze.addColorStop(0.06, 'rgba(232,166,90,0.32)');
    haze.addColorStop(0.22, 'rgba(70,150,160,0.16)');
    haze.addColorStop(0.55, 'rgba(20,50,60,0.08)');
    haze.addColorStop(1, 'rgba(5,6,10,0)');
    ctx.fillStyle = haze; ctx.fillRect(0, 0, W, H);
    ctx.lineWidth = 1;
    // Longitudinal threads.
    for (const x of XS) for (const y of YS) {
      if (Math.abs(x) < 4 && Math.abs(y) < 4) continue; // keep the middle clear
      const a = project(x, y, cam.z + 0.6), b = project(x, y, cam.z + VIEW);
      if (!a || !b) continue;
      const g = ctx.createLinearGradient(a.x, a.y, b.x, b.y);
      g.addColorStop(0, 'rgba(255,190,110,0.85)'); g.addColorStop(0.35, 'rgba(232,166,90,0.45)'); g.addColorStop(1, 'rgba(92,196,204,0.05)');
      ctx.strokeStyle = g;
      // A soft wide pass, then the thin bright thread.
      ctx.globalAlpha = 0.25; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
      ctx.globalAlpha = 1; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    }
    // Ribs.
    const first = Math.ceil(cam.z / RIB) * RIB;
    for (let z = first; z < cam.z + VIEW; z += RIB) {
      const fade = 1 - (z - cam.z) / VIEW;
      const pulse = 0.5 + 0.5 * Math.sin(z * 0.35 - t / 900);
      ctx.strokeStyle = `rgba(232,166,90,${(0.1 + 0.3 * pulse) * fade * fade})`;
      for (const y of [YS[0], YS[YS.length - 1]]) {
        const a = project(XS[0], y, z), b = project(XS[XS.length - 1], y, z);
        if (a && b) { ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); }
      }
      for (const x of [XS[0], XS[XS.length - 1]]) {
        const a = project(x, YS[0], z), b = project(x, YS[YS.length - 1], z);
        if (a && b) { ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); }
      }
    }
    // Threads tying the hovered moment to its neighbours in time.
    if (hovered >= 0) {
      const m = MOMENTS[hovered];
      const p = project(m.x + 1, m.y + 1, m.z);
      [hovered - 1, hovered + 1].forEach((j) => {
        const n = MOMENTS[j]; if (!n || !p) return;
        const q = project(n.x + 1, n.y + 1, n.z); if (!q) return;
        ctx.strokeStyle = 'rgba(92,196,204,0.6)'; ctx.lineWidth = 1.2;
        ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(q.x, q.y); ctx.stroke(); ctx.lineWidth = 1;
      });
    }
    // Gold dust drifting toward the past.
    for (const d of dust) {
      let z = d.z - ((t / 1000) * (reduce ? 0 : 0.8) * (0.5 + d.s)) % VIEW;
      z = ((z - cam.z) % VIEW + VIEW) % VIEW + cam.z + 0.5;
      const p = project(d.x, d.y, z); if (!p) continue;
      const a = Math.min(1, (1 - (z - cam.z) / VIEW) * 1.2) * (0.3 + 0.7 * d.s);
      ctx.fillStyle = `rgba(255,205,130,${a * 0.7})`;
      const sz = Math.min(3, 0.6 + p.s * 0.04);
      ctx.fillRect(p.x, p.y, sz, sz);
    }
  }

  let momentsIn = 0;
  function placeMoments() {
    const pw = innerWidth <= 640 ? 230 : 300;
    MOMENTS.forEach((m, i) => {
      const p = project(m.x, m.y, m.z);
      const el = m.el;
      if (!p || p.dz > 70) { el.style.opacity = '0'; el.style.visibility = 'hidden'; return; }
      // Panels read at a fixed world size: 6 units wide.
      const scale = (p.s * 6) / pw;
      const near = smooth(0.8, 4, p.dz), far = 1 - smooth(40, 70, p.dz);
      const o = near * far * momentsIn;
      el.style.visibility = o > 0.02 ? 'visible' : 'hidden';
      el.style.opacity = o.toFixed(3);
      el.style.pointerEvents = o > 0.5 && scale > 0.35 ? 'auto' : 'none';
      el.tabIndex = o > 0.5 && scale > 0.35 ? 0 : -1;
      const tilt = i === hovered ? 0 : (m.x < 0 ? 10 : -10);
      el.style.transform = `translate(${p.x.toFixed(1)}px, ${p.y.toFixed(1)}px) scale(${scale.toFixed(4)}) rotateY(${tilt}deg)`;
      el.style.zIndex = String(1000 - Math.round(p.dz));
    });
  }

  function yearAt(z) {
    const ms = MOMENTS;
    if (z <= ms[0].z) return ms[0].when;
    for (let i = 0; i < ms.length - 1; i++) {
      if (z < ms[i + 1].z) {
        const t = (z - ms[i].z) / (ms[i + 1].z - ms[i].z);
        if (t < 0.5) return ms[i].when;
        const y = ms[i].year + (ms[i + 1].year - ms[i].year) * t;
        return ms[i + 1].year >= 2026 ? String(Math.floor(y)) : ms[i + 1].when;
      }
    }
    return ms[ms.length - 1].when;
  }

  // ---------- loop ----------
  function loop(t) {
    requestAnimationFrame(loop);
    const dpr = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight; F = H * 0.9;
    if (cv.width !== Math.round(W * dpr)) { cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    // Arrival: white fades, the tumble settles.
    const arrive = smooth(0, 0.06, scrollP);
    whiteout.style.opacity = String(1 - smooth(0, 0.035, scrollP) * 1);
    intro.style.opacity = String(smooth(0.005, 0.03, scrollP) * (1 - smooth(0.07, 0.1, scrollP)));
    look.x += (look.tx - look.x) * 0.05; look.y += (look.ty - look.y) * 0.05;
    cam.z = smooth(0.06, 0.98, scrollP) * DEPTH_END;
    cam.x = look.x * 1.2 + Math.sin(cam.z * 0.05) * 0.6;
    cam.y = look.y * 0.8;
    cam.roll = reduce ? 0 : (1 - arrive) * 0.6 * Math.sin(t / 700) + Math.sin(cam.z * 0.03) * 0.04;

    // Moments appear once the opening line has gone.
    momentsIn = smooth(0.08, 0.11, scrollP);
    drawThreads(t);
    placeMoments();
    yearEl.textContent = yearAt(cam.z + 4);
  }

  onScroll();
  requestAnimationFrame(loop);
})();
</script>
